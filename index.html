<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nilesh &amp; Radhika | ConverPage</title>

    <!-- Improve Google Fonts connection performance -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel:wght@500;600&family=Cormorant+Garamond:wght@500;600&family=Noto+Serif+Devanagari:wght@500;600&display=swap"
        rel="stylesheet"
    >
    <!-- Main stylesheet -->
    <link
        rel="stylesheet"
        href="seal.css"
    >
</head>

<body>
     <!-- ======================================================
         OPENING SEAL SCREEN
    ======================================================= -->
    <section
        class="seal-screen"
        id="seal-screen"
        aria-label="Open engagement invitation"
    >
        <!-- Background -->
        <img
            class="seal-screen-background"
            src="assets/seal-background.png"
            alt=""
            aria-hidden="true"
        >

        <!-- Falling petals -->
        <div
            class="seal-petal-layer"
            id="seal-petal-layer"
            aria-hidden="true"
        ></div>

        <!-- Main opening content -->
        <div class="seal-content">

            <p class="seal-introduction">
                TOGETHER WITH OUR FAMILIES
            </p>
        
            <h1 class="seal-couple-names">
                Nilesh
                <span class="seal-name-divider">&amp;</span>
                Radhika
            </h1>
        
            <div class="seal-divider"></div>
        
            <div class="envelope-wrapper" id="envelope-wrapper">
        
                <div class="gold-sparkles"></div>
        
                <div class="envelope">
        
                    <div class="envelope-back"></div>
        
                    <div class="envelope-card">

                        <p class="envelope-card-invocation">
                            श्री गणेशाय नमः
                        </p>
                    
                        <h2 class="envelope-card-names">
                            Nilesh
                            <span>&amp;</span>
                            Radhika
                        </h2>
                    
                        <div class="envelope-card-divider"></div>
                    
                        <p class="envelope-card-event">
                            Engagement Ceremony
                        </p>
                    
                        <p class="envelope-card-date">
                            30 August 2026
                        </p>
                    
                    </div>
        
                    <div class="envelope-flap"></div>
        
                    <div class="envelope-front-left"></div>
        
                    <div class="envelope-front-right"></div>
        
                    <div class="envelope-front-bottom"></div>
        
                    <button
                        class="wax-seal"
                        id="wax-seal"
                        type="button">
        
                        <span class="wax-seal-piece wax-seal-piece--left"></span>
        
                        <span class="wax-seal-piece wax-seal-piece--right"></span>
        
                        <span class="wax-seal-inner">
        
                            <img
                                src="assets/ganesha-seal-premium.svg"
                                class="wax-seal-ganesha"
                                alt=""
                            >
        
                        </span>
        
                    </button>
        
                </div>
        
            </div>
        
            <div class="tap-wrapper">
        
                <span class="tap-text">
                    TAP THE SEAL
                </span>
        
                <span class="tap-subtext">
                    TO OPEN
                </span>
        
            </div>
        
        </div>
    </section>

    <!-- ======================================================
        FALLING PETALS
        Decorative foreground animation across the invitation.
    ======================================================= -->
    <div
    class="petal-layer"
    id="petal-layer"
    aria-hidden="true"
    ></div>


    <!-- Main JavaScript -->
    <script src="seal.js"></script>

</body>

</html>
