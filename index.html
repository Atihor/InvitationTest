<!DOCTYPE html>
<html lang="en">
    <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@500;600;700&display=swap"
    rel="stylesheet"
>
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nilesh &amp; Radhika | Engagement Invitation</title>

    <!-- Main stylesheet -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- ======================================================
         INVITATION PAGE
         The background image controls the page dimensions.
         Future sections will be positioned relative to it.
    ======================================================= -->
    <main class="invitation-page">

        <!-- Invitation background -->
        <img
            class="invitation-background"
            src="assets/background.png"
            alt="Floral engagement invitation background"
        >

        <!-- Animated Ganpati -->
        <figure class="opening-ganpati">
            <img
                class="opening-ganpati-image"
                src="assets/ganpati.png"
                alt="Lord Ganpati"
            >
        </figure>
        <!-- Traditional Marathi invocation -->
        <p class="opening-invocation" lang="mr">
            ॥ श्री गणेशाय नमः ॥
        </p>

    </main>

    <!-- Main JavaScript -->
    <script src="script.js"></script>

</body>

</html>
